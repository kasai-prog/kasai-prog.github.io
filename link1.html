        .container {

            color: #555;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        /* 画像ボタンを配置するリンクエリア */
        .btn-link {
            display: inline-block;
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-link:hover {
            transform: scale(1.02);
        }
        .btn-link:active {
            transform: scale(0.98);

        }
        /* button.png のスタイル定義 */
        .coupon-img {
            width: 100%;
            max-width: 360px;

            background: #fdfdfd;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        /* 初期状態ではらくらくスマホ用ボタンを隠す */
        #rakuraku-area {
            display: none;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 3px dashed #dc3545;
            background-color: #fff8f8;
            padding: 15px;
            border-radius: 12px;
        }
        .rakuraku-title {
            color: #dc3545;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .btn-warning {
            display: block;
            background-color: #ffc107;
            color: #212529;
            padding: 18px;
